<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — a night in the city</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a1128; height: 100%; }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
  #stars { position: absolute; top: 14px; right: 18px; font-size: 26px; letter-spacing: 4px; color: #ffd24f; text-shadow: 0 0 8px #000; }
  #cash { position: absolute; top: 48px; right: 18px; font-size: 24px; font-weight: bold; color: #7dff5e; text-shadow: 0 0 8px #000; }
  #health { position: absolute; top: 84px; right: 18px; width: 150px; height: 10px; background: rgba(0,0,0,.55); border: 1px solid #888; }
  #healthbar { height: 100%; width: 100%; background: #58d68d; }
  #compass { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 15px; letter-spacing: 2px; color: #cdd8ff; background: rgba(0,0,0,.45); padding: 4px 12px; border-radius: 4px; }
  #objective { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); font-size: 19px; font-weight: bold; color: #ffe14d; text-shadow: 0 2px 6px #000; background: rgba(0,0,0,.45); padding: 6px 14px; border-radius: 4px; white-space: nowrap; }
  #timer { position: absolute; bottom: 62px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: bold; color: #ff8a5c; text-shadow: 0 2px 6px #000; }
  #speed { position: absolute; bottom: 18px; right: 20px; font-size: 26px; font-weight: bold; text-shadow: 0 2px 6px #000; }
  #minimap { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); border: 2px solid rgba(255,255,255,.55); border-radius: 6px; background: #0a1128; }
  #toast { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; color: #7dff5e; text-shadow: 0 2px 6px #000; transition: opacity .4s; }
  #menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(4, 8, 20, .78); pointer-events: auto; text-align: center; padding: 20px; }
  #menu h1 { font-size: 64px; letter-spacing: 10px; margin: 0; color: #ffe14d; text-shadow: 0 0 24px #ff7a3c; }
  #menu .sub { font-size: 20px; color: #7fd4ff; margin: 6px 0 18px; }
  #menu p { max-width: 560px; font-size: 16px; line-height: 1.5; color: #dfe6ff; }
  #menu .keys { font-size: 14px; color: #aab4d4; }
  #menu .fine { font-size: 12px; color: #778; }
  #startBtn { pointer-events: auto; cursor: pointer; font-size: 22px; font-weight: bold; padding: 14px 34px; margin-top: 14px; color: #0a1128; background: #ffe14d; border: none; border-radius: 6px; }
  #startBtn:hover { background: #ffd24f; }
  #endcard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10, 4, 8, .8); pointer-events: auto; text-align: center; }
  #endcard h1 { font-size: 56px; letter-spacing: 8px; color: #ff4040; margin: 0; }
  #endcard p { font-size: 18px; color: #fff; }
  #endcard button { pointer-events: auto; cursor: pointer; font-size: 20px; font-weight: bold; padding: 12px 28px; color: #0a1128; background: #ffe14d; border: none; border-radius: 6px; }
  #status { position: absolute; left: 6px; bottom: 4px; font-size: 10px; color: rgba(255,255,255,.35); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="status">loading</div>
<script src="vendor/three.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
